    <text class="texto-info" x="546" y="425">
      <tspan id="info-linea" x="546" dy="0">Clique em uma região do mapa</tspan>
      <tspan id="info-lineb" x="546" dy="20">ou em um item da legenda.</tspan>
    </text>
    <text class="texto-pequeno" x="546" y="570">Cores ilustrativas · fundo transparente</text>
  </g>

  <script type="application/ecmascript"><![CDATA[
    (function () {
      var svg = document.documentElement;
      var regions = Array.prototype.slice.call(svg.querySelectorAll('.bioma'));
      var legendItems = Array.prototype.slice.call(svg.querySelectorAll('.legenda-item'));
      var title = svg.querySelector('#info-title');
      var lineA = svg.querySelector('#info-linea');
      var lineB = svg.querySelector('#info-lineb');

      function showInfo(region) {
        if (!region) return;
        title.textContent = region.getAttribute('data-nome') || 'Bioma';
        lineA.textContent = region.getAttribute('data-info1') || '';
        lineB.textContent = region.getAttribute('data-info2') || '';
      }

      function selectRegion(region) {
        if (!region) return;
        regions.forEach(function (item) {
          var active = item === region;
          item.classList.toggle('selecionado', active);
          item.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        showInfo(region);
      }

      regions.forEach(function (region) {
        region.addEventListener('mouseenter', function () { showInfo(region); });
        region.addEventListener('focus', function () { showInfo(region); });
        region.addEventListener('click', function () { selectRegion(region); });
        region.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectRegion(region);
          }
        });
      });

      legendItems.forEach(function (item) {
        function activate() {
          var region = svg.querySelector('#' + item.getAttribute('data-target'));
          selectRegion(region);
        }
        item.addEventListener('click', activate);
        item.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activate();
          }
        });
      });
    }());
  ]]></script>
</svg>
