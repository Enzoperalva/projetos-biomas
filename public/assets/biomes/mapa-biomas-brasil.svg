<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Mapa vetorial dos biomas brasileiros</title>
  <desc id="svg-desc">Mapa esquemático do Brasil com seis regiões vetoriais separadas e interativas: Amazônia, Cerrado, Caatinga, Mata Atlântica, Pantanal e Pampa.</desc>
  <metadata>
    Arquivo SVG editável com seis caminhos independentes. A distribuição geral é ilustrativa e simplificada; os contornos deste desenho não constituem reprodução cartográfica oficial dos limites do IBGE em escala 1:250.000.
  </metadata>
  <style>
    .bioma { cursor: pointer; stroke: #f8f6ed; stroke-width: 2.3; stroke-linejoin: round; stroke-linecap: round; transition: filter .16s ease, stroke-width .16s ease; }
    .bioma:hover, .bioma:focus-visible { filter: brightness(1.08) saturate(1.13); stroke: #243b32; stroke-width: 3.2; outline: none; }
    .bioma.selecionado { stroke: #203a30; stroke-width: 3.4; filter: brightness(1.03) saturate(1.08); }
    .legenda-item { cursor: pointer; }
    .legenda-item:hover text, .legenda-item:focus-visible text { fill: #0d4f3a; text-decoration: underline; outline: none; }
    .legenda-item:focus-visible { outline: none; }
    .titulo { font: 700 23px system-ui, -apple-system, sans-serif; letter-spacing: 1.3px; fill: #203a30; }
    .subtitulo { font: 400 12px system-ui, -apple-system, sans-serif; fill: #5b6e63; }
    .rotulo { font: 600 14px system-ui, -apple-system, sans-serif; fill: #25382f; }
    .texto-info { font: 400 13px system-ui, -apple-system, sans-serif; fill: #43574d; }
    .texto-pequeno { font: 400 10px system-ui, -apple-system, sans-serif; fill: #76867c; }
  </style>

